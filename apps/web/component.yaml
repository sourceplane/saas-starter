apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: web
  description: The Next.js SaaS Starter — Postgres + Drizzle, Stripe subscriptions, JWT auth, teams (Next.js on Cloudflare Workers + Static Assets via @opennextjs/cloudflare, per environment)
spec:
  type: cloudflare-workers-assets-turbo
  lifecycle: production
  owner: platform
  domain: web
  path: apps/web
  # Its own lane per environment: the Next.js build is the longest job in the
  # plan, and a shared lane would wait on it.
  lane: isolated
  # The Hyperdrive config must exist before this deploys (its id is rendered
  # into the Worker's HYPERDRIVE binding), and the schema must be applied
  # before the Worker takes traffic (db-migrate, which itself waits on the
  # Supabase project).
  dependsOn:
    - component: cloudflare-hyperdrive
    - component: db-migrate
  secretEnv:
    WIRING_CLOUDFLARE_HYPERDRIVE_STAGE: "secret://saas-starter/saas-starter/stage/WIRING_CLOUDFLARE_HYPERDRIVE"
    WIRING_CLOUDFLARE_HYPERDRIVE_PROD: "secret://saas-starter/saas-starter/prod/WIRING_CLOUDFLARE_HYPERDRIVE"
  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"

    workspaceDir: ../..
    appDir: .

    turboFilter: "@app/web"
    wranglerConfig: wrangler.jsonc

    # @opennextjs/cloudflare emits a Worker entrypoint plus a static-assets
    # directory bound via ASSETS — both deploy in one `wrangler deploy`.
    workerEntrypoint: .open-next/worker.js
    assetsDir: .open-next/assets

    # Per-env worker name: saas-starter-web-{dev,stage,prod}.
    workerName: saas-starter-web
    environmentAwareWorkerName: true

    # The account's workers.dev subdomain; exported to the smoke step as
    # ${WORKERS_DEV_SUBDOMAIN} and used to build ${DEPLOYED_URL}.
    workersDevSubdomain: your-workers-subdomain

    installCommand: pnpm install --frozen-lockfile
    # Render this environment's wrangler config from the Hyperdrive root's
    # wiring document (the verify lane already rendered from the fixture
    # through `wire:fixture`; a deploy lane re-renders with the real id), then
    # build. BASE_URL is the environment's Worker origin — the Worker reads it
    # at run time from wrangler.jsonc's var (same placeholder subdomain as
    # above); exporting it here keeps the build's view consistent.
    buildCommand: node ../../tooling/wire/live.mjs --template wrangler.template.jsonc --out wrangler.jsonc --components cloudflare-hyperdrive --env "${ORUN_ENVIRONMENT}" && BASE_URL="https://saas-starter-web-${ORUN_ENVIRONMENT}.your-workers-subdomain.workers.dev" pnpm exec turbo run build --filter=@app/web

    # Smoke: the home page renders and carries the app's marker text.
    smokeCommand: "html=$(curl -sfL \"${DEPLOYED_URL}/\") && echo \"${html}\" | grep -q 'Build Your SaaS'"
  labels:
    team: platform
    layer: delivery
    surface: web
    runtime: cloudflare
